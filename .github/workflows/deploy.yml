# Test on every push; on main, then update the database and publish the page.
#
#   push (any branch) ─► test ─► [main only] database ─► pages
#
# Secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN  supabase.com > Account > Access Tokens
#   SUPABASE_DB_PASSWORD   the project's database password
# Pages must be set to Settings > Pages > Source: GitHub Actions.
# Actions are pinned to commit SHAs (a moved tag can't change what runs with the
# secrets); Dependabot (.github/dependabot.yml) proposes updates.
name: Test and deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Deploys from main run one at a time, in order; a newer push waits rather than
# cancelling one halfway. Other branches just test.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'deploy-main' || format('test-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  # Applies migrations in supabase/migrations that the project hasn't run yet,
  # each in its own transaction. Runs before the page is published, so a new
  # page never meets an old database.
  database:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      PROJECT_REF: tnjledlrzwtnocvmtgrf
    # The secrets are given only to the steps that run the Supabase CLI
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359  # v3
        with:
          version: 2.117.0
      - name: Link the Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Migrations still to apply
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --dry-run
      - name: Apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --yes

  # Publishes only the page and its images (not the rest of the repo).
  pages:
    needs: database
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Collect the site
        run: mkdir _site && cp -r index.html assets _site/ && touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5
