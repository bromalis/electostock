# Once a day, make one tiny request to the database so the Supabase free plan
# never pauses the project for inactivity (it pauses after about a week).
# The hourly Google Sheet refresh also counts as activity; this is a second,
# independent source. If the request fails, the job fails and GitHub emails
# you, so it doubles as a daily "is the database reachable?" check.
#
# GitHub turns off scheduled workflows in public repos after 60 days without a
# push (it emails a warning first); any push, or "Enable workflow" on the
# Actions tab, turns it back on.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 9 * * *'   # daily, 09:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        env:
          SUPABASE_URL: https://tnjledlrzwtnocvmtgrf.supabase.co
          SUPABASE_KEY: sb_publishable_HzFIPbDEhWRX7g9A6E_FgA_nNi4PQnV   # publishable: public by design
        run: |
          reply=$(curl -fsS --retry 3 --retry-delay 20 --retry-all-errors \
            -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}')
          echo "Reply: $reply"
          [ "$reply" = '"ok"' ]
